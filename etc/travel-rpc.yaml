Name: travel-rpc
ListenOn: 0.0.0.0:9205
Timeout: 30000

# IM 订单事件推送（imGateway 系统消息接口）；GatewayUrl 为空时禁用，不影响订单主流程
Im:
  GatewayUrl: http://localhost:9281
  Token:

DatabaseConf:
  Type: mysql
  Host: 127.0.0.1
  Port: 13307
  DBName: travel
  Username: root # set your username
  Password: '123456'  # set your password
  MaxOpenConn: 100
  SSLMode: disable
  CacheTime: 5
  Debug: true # 打印每条 SQL（含参数、耗时），生产环境建议关闭
RedisConf:
  Host: 127.0.0.1:6380
  Db: 0

JWTAccessSecret: wanl-shop-jwt-secret-change-me
JWTAccessExpire: 604800 # 7 days in seconds

# 机器翻译（P4）：商户录入基准语言后，异步翻译产品/套餐文案填充 translation 表。
# 未配置 ApiKey（环境变量 TRANSLATE_API_KEY）时自动降级为 no-op，目录返回基准语言。
TranslateConf:
  Provider: deepl                                    # 翻译提供方；留空则禁用自动翻译
  Endpoint: https://api-free.deepl.com/v2/translate  # DeepL 翻译端点
  # ApiKey 通过环境变量 TRANSLATE_API_KEY 注入，切勿硬编码到本文件
  SourceLang: auto                                   # 源语言，auto=自动检测
  TargetLangs:                                       # 目标语言（locale 码）
    - zh-CN
    - en-US
    - ar
