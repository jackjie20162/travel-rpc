name: travel-rpc-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install protobuf tools
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Install protoc
        uses: arduino/setup-protoc@v3
      - name: Generate protobuf
        run: |
          protoc --go_out=./travel --go_opt=paths=source_relative --go-grpc_out=./travel --go-grpc_opt=paths=source_relative desc/travel.proto
      - name: Generate Ent
        run: go run -mod=mod entgo.io/ent/cmd/ent generate ./ent/schema --feature sql/execquery
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
