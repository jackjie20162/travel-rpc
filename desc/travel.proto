syntax = "proto3";

package travel;
option go_package = "gitee.com/meinongyihe/travel-rpc/travel";

message Empty {}
message Product { int64 id=1; int64 tenant_id=2; int64 merchant_id=3; string code=4; string title=5; string slug=6; string destination=7; string description=8; string currency=9; int64 min_price=10; string status=11; }
message ProductIdRequest { int64 id=1; }
message ProductListRequest { string keyword=1; string destination=2; int32 page=3; int32 page_size=4; }
message ProductListResponse { repeated Product items=1; int64 total=2; }
message InventoryRequest { int64 package_id=1; string date=2; string time_slot=3; int32 quantity=4; }
message InventoryResponse { bool available=1; int32 remaining=2; int64 unit_price=3; string currency=4; }
message ReserveInventoryRequest { int64 package_id=1; string date=2; string time_slot=3; int32 quantity=4; string reservation_key=5; }
message ReserveInventoryResponse { bool reserved=1; int32 remaining=2; int64 unit_price=3; string currency=4; }
message CreateOrderRequest { int64 product_id=1; int64 package_id=2; string date=3; string time_slot=4; int32 quantity=5; string customer_email=6; string reservation_key=7; int64 customer_id=8; }
message OrderNoRequest { string order_no=1; }
message Order { int64 id=1; string order_no=2; string status=3; int64 total_amount=4; string currency=5; }
message CreatePaymentRequest { string order_no=1; string provider=2; string idempotency_key=3; }
message Payment { int64 id=1; string payment_no=2; string order_no=3; string provider=4; string provider_payment_id=5; int64 amount=6; string currency=7; string status=8; }
message PaymentNoRequest { string payment_no=1; }
message SetPaymentProviderIDRequest { string payment_no=1; string provider_payment_id=2; }
message MarkPaymentPaidRequest { string payment_no=1; string provider_payment_id=2; }

message CreateProductRequest { string code=1; string title=2; string slug=3; string destination=4; string description=5; string currency=6; int64 min_price=7; }
message UpdateProductRequest { int64 id=1; string code=2; string title=3; string slug=4; string destination=5; string description=6; string currency=7; int64 min_price=8; }
message ProductPackage { int64 id=1; int64 product_id=2; string code=3; string name=4; string status=5; }
message CreatePackageRequest { int64 product_id=1; string code=2; string name=3; }
message PackageListRequest { int64 product_id=1; }
message PackageListResponse { repeated ProductPackage items=1; }
message UpsertInventoryRequest { int64 package_id=1; string date=2; string time_slot=3; int32 capacity=4; int64 unit_price=5; string currency=6; string status=7; }
message InventoryItem { int64 id=1; int64 package_id=2; string date=3; string time_slot=4; int32 capacity=5; int32 reserved=6; int64 unit_price=7; string currency=8; string status=9; }
message InventoryListRequest { int64 package_id=1; }
message InventoryListResponse { repeated InventoryItem items=1; }
message PublishProductRequest { int64 product_id=1; bool published=2; }

service CatalogService { rpc GetProduct(ProductIdRequest) returns (Product); rpc ListProducts(ProductListRequest) returns (ProductListResponse); }
service InventoryService { rpc Check(InventoryRequest) returns (InventoryResponse); rpc Reserve(ReserveInventoryRequest) returns (ReserveInventoryResponse); }
service OrderService { rpc Create(CreateOrderRequest) returns (Order); rpc Get(OrderNoRequest) returns (Order); }
service PaymentService { rpc Create(CreatePaymentRequest) returns (Payment); rpc Get(PaymentNoRequest) returns (Payment); rpc SetProviderID(SetPaymentProviderIDRequest) returns (Payment); rpc MarkPaid(MarkPaymentPaidRequest) returns (Payment); }
service TravelManagementService { rpc CreateProduct(CreateProductRequest) returns (Product); rpc UpdateProduct(UpdateProductRequest) returns (Product); rpc CreatePackage(CreatePackageRequest) returns (ProductPackage); rpc ListPackages(PackageListRequest) returns (PackageListResponse); rpc UpsertInventory(UpsertInventoryRequest) returns (InventoryItem); rpc ListInventory(InventoryListRequest) returns (InventoryListResponse); rpc PublishProduct(PublishProductRequest) returns (Product); }
